plugins {
    id 'com.android.application'
}

android {
    namespace 'com.azeez.reelblock'
    compileSdk 36

    defaultConfig {
        applicationId 'com.azeez.reelblock'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '5.0'
    }

    // One fixed key, so every new build installs over the old one.
    // This is a personal app, not published anywhere, so the password is kept here.
    signingConfigs {
        release {
            storeFile file('reelblock.jks')
            storePassword 'reelblock'
            keyAlias 'reelblock'
            keyPassword 'reelblock'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
